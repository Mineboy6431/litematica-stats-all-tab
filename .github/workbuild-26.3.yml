name: Build 26.3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: litematica-stats-26.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Download dependency jars
        run: |
          mkdir -p libs
          fetch_modrinth() {
            url=$(curl -fsSL -A "github-actions-build" "https://api.modrinth.com/v2/project/$1/version" \
              | jq -r --arg n "$2" '[.[].files[] | select(.filename==$n)][0].url')
            [ -n "$url" ] && [ "$url" != "null" ] && curl -fsSL -A "github-actions-build" "$url" -o "libs/$2"
          }
          fetch_modrinth litematica litematica-fabric-26.3-0.29.1.jar
          fetch_modrinth malilib malilib-fabric-26.3-0.30.2.jar
          fetch_modrinth conditional-mixin conditional-mixin-fabric-0.6.4.jar || \
            curl -fsSL "https://maven.fallenbreath.me/releases/me/fallenbreath/conditional-mixin-fabric/0.6.4/conditional-mixin-fabric-0.6.4.jar" \
              -o libs/conditional-mixin-fabric-0.6.4.jar
          for f in libs/*.jar; do unzip -tq "$f" > /dev/null; done
          ls -l libs

      - name: Patch Fabric-Loom-Version in jar manifests
        run: |
          WORK="$PWD"
          for f in libs/*.jar; do
            tmp=$(mktemp -d)
            unzip -q -o "$f" META-INF/MANIFEST.MF -d "$tmp"
            if grep -q '^Fabric-Loom-Version' "$tmp/META-INF/MANIFEST.MF"; then
              sed -i 's/^Fabric-Loom-Version:.*$/Fabric-Loom-Version: 1.17.20\r/' "$tmp/META-INF/MANIFEST.MF"
              (cd "$tmp" && zip -q "$WORK/$f" META-INF/MANIFEST.MF)
            fi
          done

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: litematica-stats-all-26.3
          path: output/*.jar
