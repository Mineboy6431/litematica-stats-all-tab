name: Build all versions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "After building, publish the jars to Modrinth"
        type: boolean
        default: false
      dry_run:
        description: "Publishing: only list what would be uploaded"
        type: boolean
        default: true
      modrinth_project:
        description: "Modrinth project slug or ID"
        type: string
        default: "litematica-stats-all"
      version_type:
        description: "Release channel on Modrinth"
        type: choice
        options: [beta, release, alpha]
        default: beta
      changelog:
        description: "Changelog text"
        type: string
        default: "Adds an All tab to the material list that shows blocks, entities and container contents together."
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - mc: "1.18.2"
            dir: litematica-stats-1.18.2
            java: 21
            jars: "litematica:litematica-fabric-1.18.2-0.11.7.jar malilib:malilib-fabric-1.18.2-0.12.1.jar"
            conditional_mixin: false
            patch_loom: false
          - mc: "1.19.4"
            dir: litematica-stats-1.19.4
            java: 21
            jars: "litematica:litematica-fabric-1.19.4-0.14.7.jar malilib:malilib-fabric-1.19.4-0.15.4.jar"
            conditional_mixin: false
            patch_loom: false
          - mc: "1.20.1"
            dir: litematica-stats-1.20.1
            java: 21
            jars: "litematica:litematica-fabric-1.20.1-0.15.4.jar malilib:malilib-fabric-1.20.1-0.16.3.jar"
            conditional_mixin: false
            patch_loom: false
          - mc: "1.21.1"
            dir: litematica-stats-1.21.1
            java: 21
            jars: "litematica:litematica-fabric-1.21-0.19.61.jar malilib:malilib-fabric-1.21-0.21.10.jar"
            conditional_mixin: false
            patch_loom: false
          - mc: "1.21.11"
            dir: litematica-stats
            java: 21
            jars: "litematica:litematica-fabric-1.21.11-0.26.16.jar malilib:malilib-fabric-1.21.11-0.27.20.jar"
            conditional_mixin: true
            patch_loom: false
          - mc: "26.2"
            dir: litematica-stats-26.2
            java: 26
            jars: "litematica:litematica-fabric-26.2-0.28.8.jar malilib:malilib-fabric-26.2-0.29.6.jar"
            conditional_mixin: true
            patch_loom: true
          - mc: "26.3"
            dir: litematica-stats-26.3
            java: 26
            jars: "litematica:litematica-fabric-26.3-0.29.1.jar malilib:malilib-fabric-26.3-0.30.2.jar"
            conditional_mixin: true
            patch_loom: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download dependency jars
        env:
          JARS: ${{ matrix.jars }}
          CONDITIONAL_MIXIN: ${{ matrix.conditional_mixin }}
        run: |
          mkdir -p libs
          fetch_modrinth() {
            url=$(curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "github-actions-build" "https://api.modrinth.com/v2/project/$1/version" \
              | jq -r --arg n "$2" '[.[].files[] | select(.filename==$n)][0].url')
            [ -n "$url" ] && [ "$url" != "null" ] && curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "github-actions-build" "$url" -o "libs/$2"
          }
          for spec in $JARS; do
            proj="${spec%%:*}"
            file="${spec#*:}"
            fetch_modrinth "$proj" "$file" || { echo "::error::Could not download $file from Modrinth"; exit 1; }
          done
          if [ "$CONDITIONAL_MIXIN" = "true" ]; then
            fetch_modrinth conditional-mixin conditional-mixin-fabric-0.6.4.jar || \
              curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors "https://maven.fallenbreath.me/releases/me/fallenbreath/conditional-mixin-fabric/0.6.4/conditional-mixin-fabric-0.6.4.jar" \
                -o libs/conditional-mixin-fabric-0.6.4.jar
          fi
          for f in libs/*.jar; do unzip -tq "$f" > /dev/null; done
          ls -l libs

      - name: Patch Fabric-Loom-Version in jar manifests
        if: ${{ matrix.patch_loom }}
        run: |
          WORK="$PWD"
          for f in libs/*.jar; do
            tmp=$(mktemp -d)
            unzip -q -o "$f" META-INF/MANIFEST.MF -d "$tmp"
            if grep -q '^Fabric-Loom-Version' "$tmp/META-INF/MANIFEST.MF"; then
              sed -i 's/^Fabric-Loom-Version:.*$/Fabric-Loom-Version: 1.17.20\r/' "$tmp/META-INF/MANIFEST.MF"
              (cd "$tmp" && zip -q "$WORK/$f" META-INF/MANIFEST.MF)
            fi
          done

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          attempt=1
          while true; do
            ./gradlew build --console=plain -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000 2>&1 | tee "$RUNNER_TEMP/build.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ] && [ "$attempt" -lt 3 ] && grep -qE "Could not GET|Could not resolve all (files|artifacts)|Read timed out|Connection reset|Connect timed out" "$RUNNER_TEMP/build.log"; then
              echo "Network problem while resolving dependencies, retrying ($attempt/3)"
              attempt=$((attempt + 1))
              sleep 20
              continue
            fi
            break
          done
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E -A3 "error:|What went wrong|Could not (resolve|find|get)|Execution failed|cannot find symbol|incompatible types|does not exist" "$RUNNER_TEMP/build.log" | grep -v '^--$' | head -n 30)
            {
              echo "### Build ${{ matrix.mc }} failed"
              echo '```'
              echo "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(printf '%s\n' "$summary" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}')
            echo "::error title=Build ${{ matrix.mc }} failed::$msg"
          fi
          exit "$status"

      - name: Dump API signatures (26.3 only)
        if: ${{ always() && matrix.mc == '26.3' }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/api-dump.txt"
          : > "$OUT"
          find_jar() {
            for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE" -name '*.jar' -not -path '*gradle-wrapper*' 2>/dev/null); do
              if unzip -Z1 "$j" 2>/dev/null | grep -qx "$1"; then echo "$j"; return 0; fi
            done
            return 1
          }
          list_pkg() {
            for j in $(find "$HOME/.gradle" -name '*.jar' 2>/dev/null); do
              unzip -Z1 "$j" 2>/dev/null | grep "^$1"
            done | sort -u | head -n "${2:-150}"
          }
          dump() {
            echo "---- $2" >> "$OUT"
            if [ -n "$3" ]; then
              javap -public -cp "$1" "$2" 2>&1 | grep -E "$3" | head -n 70 >> "$OUT"
            else
              javap -public -cp "$1" "$2" 2>&1 | head -n 90 >> "$OUT"
            fi
          }
          MC_JAR=$(find_jar 'net/minecraft/client/gui/screens/Screen.class')
          FAPI_SCREEN=$(find_jar 'net/fabricmc/fabric/api/client/screen/v1/ScreenEvents.class')
          MAL=$(ls libs/malilib*.jar | head -n 1)
          LIT=$(ls libs/litematica*.jar | head -n 1)
          echo "Minecraft jar: $MC_JAR" >> "$OUT"
          echo "Fabric screen jar: $FAPI_SCREEN" >> "$OUT"
          { echo "== net/minecraft/client/gui classes"; unzip -Z1 "$MC_JAR" | grep -E '^net/minecraft/client/gui/[A-Za-z]+(\$[A-Za-z]+)?\.class$' | head -n 80; } >> "$OUT"
          for c in net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.GuiGraphicsExtractor; do
            dump "$MC_JAR" "$c" "fill|renderItem|extractItem|drawString|extractText|class "
          done
          dump "$MC_JAR" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen "render|extract|leftPos|topPos|imageWidth|imageHeight|getMenu|class "
          dump "$MC_JAR" net.minecraft.client.gui.screens.Screen "render|extract|class "
          dump "$MC_JAR" net.minecraft.client.Minecraft "screen|Screen|gui|class "
          dump "$FAPI_SCREEN" net.fabricmc.fabric.api.client.screen.v1.ScreenEvents
          for n in $(unzip -Z1 "$FAPI_SCREEN" | grep 'ScreenEvents\$' | sed 's#/#.#g; s#\.class$##'); do dump "$FAPI_SCREEN" "$n"; done
          { echo "== fabric rendering classes"; list_pkg 'net/fabricmc/fabric/api/client/rendering/' 150; } >> "$OUT"
          { echo "== fabric screen classes"; list_pkg 'net/fabricmc/fabric/api/client/screen/' 60; } >> "$OUT"
          { echo "== malilib classes"; unzip -Z1 "$MAL" | grep -E 'fi/dy/masa/malilib/(gui/(config|button|GuiConfigs|GuiListBase|GuiBase)|config/|event/|hotkeys/|interfaces/|render/GuiContext)' | head -n 140; } >> "$OUT"
          dump "$MAL" fi.dy.masa.malilib.gui.GuiConfigsBase
          dump "$MAL" fi.dy.masa.malilib.config.options.ConfigColor
          dump "$MAL" fi.dy.masa.malilib.config.options.ConfigBoolean
          dump "$MAL" fi.dy.masa.malilib.config.options.ConfigHotkey
          dump "$MAL" fi.dy.masa.malilib.config.IConfigHandler
          dump "$MAL" fi.dy.masa.malilib.config.ConfigManager
          dump "$MAL" fi.dy.masa.malilib.event.InitializationHandler
          dump "$MAL" fi.dy.masa.malilib.render.GuiContext
          dump "$LIT" fi.dy.masa.litematica.gui.GuiConfigs
          dump "$LIT" fi.dy.masa.litematica.config.Configs
          dump "$LIT" 'fi.dy.masa.litematica.config.Configs$Colors'
          dump "$LIT" fi.dy.masa.litematica.render.OverlayRenderer
          dump "$LIT" fi.dy.masa.litematica.world.SchematicWorldHandler
          for c in fi.dy.masa.malilib.gui.config.registry.ConfigScreenRegistry fi.dy.masa.malilib.interfaces.IInitializationHandler fi.dy.masa.malilib.interfaces.IInitializationDispatcher 'fi.dy.masa.malilib.gui.GuiConfigsBase$ConfigOptionWrapper' fi.dy.masa.malilib.gui.button.ButtonGeneric fi.dy.masa.malilib.config.options.ConfigInteger fi.dy.masa.malilib.config.options.ConfigString fi.dy.masa.malilib.config.options.ConfigOptionList fi.dy.masa.malilib.config.IConfigOptionListEntry fi.dy.masa.malilib.config.ConfigUtils fi.dy.masa.malilib.config.IConfigBase fi.dy.masa.malilib.util.data.Color4f; do
            dump "$MAL" "$c"
          done
          dump "$MAL" fi.dy.masa.malilib.gui.GuiBase "openGui|addMessage|addButton|addLabel|class |setTitle|initGui|setParent"
          dump "$MAL" fi.dy.masa.malilib.util.InfoUtils "showGui|showInGame|class "
          { echo "== malilib render classes"; unzip -Z1 "$MAL" | grep 'fi/dy/masa/malilib/render/' | head -n 60; } >> "$OUT"
          { echo "== litematica render classes"; unzip -Z1 "$LIT" | grep -E 'fi/dy/masa/litematica/render/[A-Za-z]+\.class' | head -n 60; } >> "$OUT"
          { echo "== gizmo classes"; unzip -Z1 "$MC_JAR" | grep -i 'gizmo' | head -n 60; } >> "$OUT"
          for c in net.minecraft.gizmos.Gizmos net.minecraft.gizmos.GizmoStyle net.minecraft.gizmos.GizmoPrimitives; do
            dump "$MC_JAR" "$c"
          done
          FAPI_LEVEL=$(find_jar 'net/fabricmc/fabric/api/client/rendering/v1/level/LevelRenderEvents.class')
          dump "$FAPI_LEVEL" net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents
          for n in AfterTranslucentFeatures BeforeGizmos EndMain AfterSolidFeatures CollectSubmits; do
            dump "$FAPI_LEVEL" "net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents\$$n"
          done
          dump "$FAPI_LEVEL" net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderContext
          dump "$FAPI_LEVEL" net.fabricmc.fabric.api.client.rendering.v1.level.AbstractLevelRenderContext
          wc -l "$OUT"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.mc == '26.3' }}
        with:
          name: api-dump
          path: ${{ runner.temp }}/api-dump.txt

      - uses: actions/upload-artifact@v4
        with:
          name: litematica-stats-all-${{ matrix.mc }}
          path: output/*.jar

  # Further Minecraft versions: the code of the nearest existing port is built against the
  # Litematica / MaLiLib / Fabric API builds that Modrinth lists for that Minecraft version.
  # A job is skipped (not failed) when Modrinth has no Litematica build for that version.
  # .github/adapt/adapt.py applies the small API differences of each version before the build.
  # 1.21.5 - 1.21.10 are not included: they need a real port (NBT and GUI API changes).
  build-extra:
    name: Build ${{ matrix.mc }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {mc: "1.18", dir: litematica-stats-1.18.2, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.18"}
          - {mc: "1.18.1", dir: litematica-stats-1.18.2, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.18"}
          - {mc: "1.19", dir: litematica-stats-1.19.4, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.19"}
          - {mc: "1.19.1", dir: litematica-stats-1.19.4, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.19"}
          - {mc: "1.19.2", dir: litematica-stats-1.19.4, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.19"}
          - {mc: "1.19.3", dir: litematica-stats-1.19.4, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.19.3"}
          - {mc: "1.20.2", dir: litematica-stats-1.20.1, java: 21, conditional_mixin: false, patch_loom: false, adapt: ""}
          - {mc: "1.20.3", dir: litematica-stats-1.20.1, java: 21, conditional_mixin: false, patch_loom: false, adapt: ""}
          - {mc: "1.20.4", dir: litematica-stats-1.20.1, java: 21, conditional_mixin: false, patch_loom: false, adapt: ""}
          - {mc: "1.20.5", dir: litematica-stats-1.21.1, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.20.5"}
          - {mc: "1.20.6", dir: litematica-stats-1.21.1, java: 21, conditional_mixin: false, patch_loom: false, adapt: "mc-1.20.5"}
          - {mc: "1.21.2", dir: litematica-stats-1.21.1, java: 21, conditional_mixin: true, patch_loom: false, adapt: "mc-1.21.2"}
          - {mc: "1.21.3", dir: litematica-stats-1.21.1, java: 21, conditional_mixin: true, patch_loom: false, adapt: "mc-1.21.2"}
          - {mc: "1.21.4", dir: litematica-stats-1.21.1, java: 21, conditional_mixin: true, patch_loom: false, adapt: "mc-1.21.2"}
          - {mc: "26.1", dir: litematica-stats-26.2, java: 26, conditional_mixin: true, patch_loom: true, adapt: ""}
    env:
      MC: ${{ matrix.mc }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Resolve and download dependencies from Modrinth
        env:
          CONDITIONAL_MIXIN: ${{ matrix.conditional_mixin }}
        run: |
          mkdir -p libs
          api() {
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "github-actions-build" --get "https://api.modrinth.com/v2/project/$1/version" \
              --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]'
          }
          for proj in litematica malilib; do
            json=$(api "$proj")
            if ! echo "$json" | jq -e 'length > 0' > /dev/null; then
              echo "::notice::No $proj build for Minecraft $MC on Modrinth - skipping this version"
              echo "SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            file=$(echo "$json" | jq -r '.[0].files | (map(select(.primary))[0] // .[0]) | .filename')
            url=$(echo "$json" | jq -r '.[0].files | (map(select(.primary))[0] // .[0]) | .url')
            echo "$proj -> $file"
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "github-actions-build" "$url" -o "libs/$file"
          done
          if [ "$CONDITIONAL_MIXIN" = "true" ]; then
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors "https://maven.fallenbreath.me/releases/me/fallenbreath/conditional-mixin-fabric/0.6.4/conditional-mixin-fabric-0.6.4.jar" \
              -o libs/conditional-mixin-fabric-0.6.4.jar
          fi
          fapi=$(api fabric-api | jq -r '.[0].version_number')
          if [ -z "$fapi" ] || [ "$fapi" = "null" ]; then
            echo "::notice::No Fabric API build for Minecraft $MC - skipping this version"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "FABRIC_API=$fapi" >> "$GITHUB_ENV"
          echo "fabric-api -> $fapi"
          for f in libs/*.jar; do unzip -tq "$f" > /dev/null; done
          ls -l libs

      - name: Patch Fabric-Loom-Version in jar manifests
        if: ${{ env.SKIP != 'true' && matrix.patch_loom }}
        run: |
          WORK="$PWD"
          for f in libs/*.jar; do
            tmp=$(mktemp -d)
            unzip -q -o "$f" META-INF/MANIFEST.MF -d "$tmp"
            if grep -q '^Fabric-Loom-Version' "$tmp/META-INF/MANIFEST.MF"; then
              sed -i 's/^Fabric-Loom-Version:.*$/Fabric-Loom-Version: 1.17.20\r/' "$tmp/META-INF/MANIFEST.MF"
              (cd "$tmp" && zip -q "$WORK/$f" META-INF/MANIFEST.MF)
            fi
          done

      - name: Set Minecraft version in fabric.mod.json
        if: ${{ env.SKIP != 'true' }}
        run: |
          jq --arg v "$MC" '.depends.minecraft = $v' src/main/resources/fabric.mod.json > "$RUNNER_TEMP/fabric.mod.json"
          cp "$RUNNER_TEMP/fabric.mod.json" src/main/resources/fabric.mod.json

      - name: Adapt source to this Minecraft version
        if: ${{ env.SKIP != 'true' && matrix.adapt != '' }}
        env:
          ADAPT: ${{ matrix.adapt }}
        run: python3 "$GITHUB_WORKSPACE/.github/adapt/adapt.py" "$ADAPT"

      - name: Build
        if: ${{ env.SKIP != 'true' }}
        run: |
          chmod +x gradlew
          set +e
          attempt=1
          while true; do
            ./gradlew build --console=plain -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000 \
              -Pminecraft_version="$MC" \
              -Pfabric_api_version="$FABRIC_API" \
              -Parchives_base_name="litematica-stats-all-$MC" 2>&1 | tee "$RUNNER_TEMP/build.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ] && [ "$attempt" -lt 3 ] && grep -qE "Could not GET|Could not resolve all (files|artifacts)|Read timed out|Connection reset|Connect timed out" "$RUNNER_TEMP/build.log"; then
              echo "Network problem while resolving dependencies, retrying ($attempt/3)"
              attempt=$((attempt + 1))
              sleep 20
              continue
            fi
            break
          done
          if [ "$status" -ne 0 ]; then
            # Show the real cause in the run summary instead of only "exit code 1"
            summary=$(grep -E -A3 "error:|What went wrong|Could not (resolve|find|get)|Execution failed|cannot find symbol|incompatible types|does not exist" "$RUNNER_TEMP/build.log" | grep -v '^--$' | head -n 30)
            {
              echo "### Build $MC failed (Litematica/MaLiLib/Fabric API from Modrinth: see log of the download step)"
              echo '```'
              echo "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(printf '%s\n' "$summary" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}')
            echo "::error title=Build $MC failed::$msg"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ env.SKIP != 'true' }}
        with:
          name: litematica-stats-all-${{ matrix.mc }}
          path: output/*.jar

  publish:
    name: Publish to Modrinth
    needs: [build, build-extra]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: litematica-stats-all-*
          path: artifacts

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ inputs.modrinth_project }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -uo pipefail
          UA="Mineboy6431/litematica-stats-all-tab (GitHub Actions)"
          API="https://api.modrinth.com/v2"

          if ! ls -d artifacts/litematica-stats-all-*/ > /dev/null 2>&1; then
            echo "::error::No built jars found"; exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::The secret MODRINTH_TOKEN is not set"; exit 1
          fi

          # Own project: needs the token (also works for drafts)
          existing=""
          if [ -n "$MODRINTH_TOKEN" ]; then
            PROJECT_ID=$(curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "$UA" -H "Authorization: $MODRINTH_TOKEN" "$API/project/$PROJECT" | jq -r .id) \
              || { echo "::error::Project '$PROJECT' not found, or the token lacks the 'Read projects' scope"; exit 1; }
            existing=$(curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "$UA" -H "Authorization: $MODRINTH_TOKEN" "$API/project/$PROJECT_ID/version" | jq -r '.[].version_number') || existing=""
          else
            PROJECT_ID="dry-run"
          fi

          # Dependencies are resolved by slug so no project IDs have to be hard-coded
          deps='[]'
          add_dep() {
            id=$(curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors -A "$UA" "$API/project/$1" | jq -r .id 2>/dev/null) || id=""
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              deps=$(jq -c --arg id "$id" --arg t "$2" '. + [{"project_id":$id,"dependency_type":$t}]' <<< "$deps")
            else
              echo "::warning::Could not resolve '$1' on Modrinth; dependency left out"
            fi
          }
          add_dep fabric-api required
          add_dep litematica required
          add_dep malilib required
          add_dep litematica-stats incompatible
          echo "dependencies: $deps"

          fail=0
          for dir in artifacts/litematica-stats-all-*/; do
            mc="${dir#artifacts/litematica-stats-all-}"; mc="${mc%/}"
            jar=$(ls "$dir"*.jar | head -n1)
            case "$mc" in
              1.20.1) games='["1.20","1.20.1"]' ;;
              1.21.1) games='["1.21","1.21.1"]' ;;
              *)      games=$(jq -cn --arg g "$mc" '[$g]') ;;
            esac
            base=$(basename "$jar")
            ver="${base#litematica-stats-all-$mc-}"; ver="${ver%.jar}"
            vnum="$ver-mc$mc"

            if grep -qxF "$vnum" <<< "$existing"; then echo "already on Modrinth: $vnum"; continue; fi

            jq -cn \
              --arg name "${ver%%+*} for Minecraft $mc" \
              --arg vnum "$vnum" \
              --arg changelog "$CHANGELOG" \
              --arg vtype "$VERSION_TYPE" \
              --arg pid "$PROJECT_ID" \
              --argjson games "$games" \
              --argjson deps "$deps" \
              '{name:$name, version_number:$vnum, changelog:$changelog, dependencies:$deps, game_versions:$games, version_type:$vtype, loaders:["fabric"], featured:false, project_id:$pid, file_parts:["file"], primary_file:"file"}' \
              > "$RUNNER_TEMP/data.json"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] $vnum  games=$games  file=$base ($VERSION_TYPE)"
              continue
            fi

            code=$(curl -sS -o "$RUNNER_TEMP/resp.txt" -w '%{http_code}' -A "$UA" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data=@$RUNNER_TEMP/data.json;type=application/json" \
              -F "file=@$jar;type=application/java-archive" \
              "$API/version")
            if [ "$code" = "200" ]; then
              echo "uploaded: $vnum"
            else
              echo "::error::Upload of $vnum failed (HTTP $code): $(cat "$RUNNER_TEMP/resp.txt")"
              fail=1
            fi
            sleep 2
          done
          exit $fail
